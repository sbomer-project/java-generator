# Default values for java-generator-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: quay.io/sbomer/java-generator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources (Role, RoleBinding) should be created
  create: true
  # The rules required by the generator
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "configmaps", "secrets", "services", "persistentvolumeclaims"]
      verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
    # Include Tekton since we are using TaskRuns
    - apiGroups: ["tekton.dev"]
      resources: ["taskruns", "pipelineruns", "tasks"]
      verbs: ["create", "get", "list", "watch", "update", "patch", "delete", "deletecollection"]
    # Include Kueue for queue management
    - apiGroups: ["kueue.x-k8s.io"]
      resources: ["localqueues", "clusterqueues", "resourceflavors", "workloads"]
      verbs: ["get", "list", "watch"]

# --- APPLICATION CONFIG ---
config:
  logLevel: INFO
  otel:
    protocol: grpc
    endpoint: "" # placeholder
  # Default internal cluster URL for storage
  storageUrl: "http://manifest-storage-service:8085"

  kafka:
    bootstrapServers: "kafka:9092"
    schemaRegistryUrl: "http://schema-registry:8080/apis/registry/v2"

  quarkus:
    # Leave empty to let Quarkus auto-discover the K8s API (Standard K8s behavior)
    # The Super-Chart can override this if needed.
    kubernetesClientMasterUrl: ""
    # Default to false (Secure).
    # Can override this to "true" for local dev/minikube.
    trustCerts: "false"

# --- KUEUE CONFIG ---
# Kueue is mandatory for queue management
kueue:
  enabled: true
  # LocalQueue configuration (namespace-scoped)
  localQueue:
    name: java-generator-local-queue
  
  # ClusterQueue configuration (cluster-scoped)
  clusterQueue:
    name: java-generator-cluster-queue
    queueingStrategy: BestEffortFIFO
    # Resource quotas for the cluster queue
    # Kueue uses resource requests (not limits) for admission control
    resources:
      # Total CPU quota across all task types
      # Calculated as: maxConcurrent * highest CPU request among task types
      # Example: 20 pods * 500m (cdxMavenPlugin/domino request) = 10000m
      - name: cpu
        nominalQuota: 10000m
      # Total memory quota across all task types
      # Calculated as: maxConcurrent * highest memory request among task types
      # Example: 20 pods * 1000Mi = 20Gi
      - name: memory
        nominalQuota: 20Gi
      # Maximum number of concurrent TaskRuns (across all types)
      - name: pods
        nominalQuota: 20
  
  # ResourceFlavor configuration
  resourceFlavor:
    name: default-flavor

# --- TEKTON TASK CONFIG ---
task:
  name:
    domino: sbomer-domino-generator-taskrun
    cdxMavenPlugin: sbomer-cdx-maven-plugin-generator-taskrun
  otel:
    endpoint: "" # HTTP only
  # The "Agent" image used inside the TaskRun
  agent:
    image: quay.io/sbomer/java-agent
    # If tag is empty, the template will default to .Chart.AppVersion (The Git SHA)
    tag: ""
    pullPolicy: IfNotPresent
  # Resource limits for TaskRun steps
  # These values control CPU and memory allocation for generation tasks
  # Adjust based on your workload requirements and cluster capacity
  resources:
    # CycloneDX Maven Plugin task resources
    cdxMavenPlugin:
      requests:
        cpu: 500m
        memory: 1000Mi
      limits:
        cpu: 800m
        memory: 2000Mi
    # Domino task resources (typically needs more memory)
    domino:
      requests:
        cpu: 500m
        memory: 1000Mi
      limits:
        cpu: 800m
        memory: 2000Mi

  maven:
    configMapName: java-generator-maven-settings
    # Inject custom <mirrors>, <profiles>, <activeProfiles> here.
    # Do NOT include the <?xml> or <settings> root tags.
    settingsContent: ""

  gradle:
    configMapName: java-generator-gradle-init
    # Default upstream Gradle init script for CycloneDX.
    # Parent charts can override this to inject internal proxy repositories.
    initScript: |
      initscript {
        repositories {
          maven {
              url "https://plugins.gradle.org/m2/"
          }
        }
        dependencies {
          // PLUGIN_VERSION will be injected as an environment variable by the Tekton Task
          classpath "org.cyclonedx:cyclonedx-gradle-plugin:${System.env.PLUGIN_VERSION}"
        }
      }

      allprojects {
        apply plugin:org.cyclonedx.gradle.CycloneDxPlugin
        cyclonedxBom {
          includeConfigs = ["runtimeClasspath", "compileClasspath"]
          skipConfigs = ["testRuntimeClasspath", "testCompileClasspath"]
          projectType = "library"
          schemaVersion = "1.6"
          destination = file("build/sbom")
          outputName = "bom"
          includeBomSerialNumber = false
        }
      }

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

# Quarkus liveness and readiness probes
livenessProbe:
  httpGet:
    path: /q/health/live
    port: http
  # Give it time to start up before checking
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /q/health/ready
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Array for injecting custom environment variables not templated above
# Example:
# extraEnv:
#   - name: HTTP_PROXY
#     value: "http://proxy.example.com:8080"
extraEnv: []
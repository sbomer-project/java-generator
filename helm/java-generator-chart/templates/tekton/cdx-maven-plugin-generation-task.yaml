apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: {{ .Values.task.name.cdxMavenPlugin }}
  labels:
    {{- include "java-generator-chart.labels" . | nindent 4 }}
spec:
  description: Generates a CycloneDX SBOM using the Maven Plugin.
  results:
    - name: sbom-url
      description: "The JSON map of uploaded filenames to their permanent URLs"
  workspaces:
    - name: data
      description: Workspace to hold the cloned repo and the resulting SBOM.
    - name: maven-settings
      description: Mounted ConfigMap containing settings.xml
  params:
    - name: generation-id
      type: string
    - name: storage-service-url
      type: string
    - name: source-url
      type: string
      description: "Git repository or archive URL to generate manifest for"
    - name: java-version
      type: string
      default: "17.0.12-tem"
    - name: plugin-version
      type: string
      default: "2.7.10"
    - name: additional-args
      type: string
      default: ""
    - name: trace-parent
      type: string
      default: ""
  steps:
    - name: generate
      image: "{{ .Values.task.agent.image }}:{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.task.agent.pullPolicy }}
      resources:
        requests:
          cpu: 500m
          memory: 1000Mi
        limits:
          cpu: 800m
          memory: 2000Mi
      env:
        - name: TRACEPARENT
          value: "$(params.trace-parent)"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "{{ .Values.task.otel.endpoint }}"
        - name: OTEL_SERVICE_NAME
          value: "sbomer-maven-generator-taskrun"
        - name: OTEL_SERVICE_VERSION
          value: "{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      script: |
        #!/usr/bin/env bash
        set -Eeuo pipefail
        source /opt/otel/otel-helpers.sh

        otel_start_span "generate" source.url="$(params.source-url)" generation.id="$(params.generation-id)"
        trap 'otel_end_span $?' EXIT

        mkdir -p $(workspaces.data.path)/logs
        otel_tee "$(workspaces.data.path)/logs/generate.log"

        # Disable strict unbound variable checking for SDKMAN
        set +u
        echo "Initializing SDKMAN!..."
        source /workdir/.sdkman/bin/sdkman-init.sh
        if [[ "$(params.java-version)" != "17.0.12-tem" ]]; then
            echo "Installing requested Java $(params.java-version)..."
            sdk install java "$(params.java-version)" || true
            sdk use java "$(params.java-version)"
        fi
        # Re-enable strict checking
        set -u

        SOURCE_URL="$(params.source-url)"
        SOURCE_DIR="$(workspaces.data.path)/source-code"
        mkdir -p "${SOURCE_DIR}"

        echo "Resolving source from: $SOURCE_URL"
        if [[ "$SOURCE_URL" == *.zip* ]]; then
            curl -sL "${SOURCE_URL%%#*}" -o /tmp/source.zip
            unzip -q /tmp/source.zip -d "${SOURCE_DIR}"
        elif [[ "$SOURCE_URL" == *.tar.gz* ]] || [[ "$SOURCE_URL" == *.tgz* ]]; then
            curl -sL "${SOURCE_URL%%#*}" | tar -xz -C "${SOURCE_DIR}"
        else
            GIT_URL="${SOURCE_URL%#*}"
            GIT_REV="${SOURCE_URL#*#}"
            [[ "$GIT_REV" == "$GIT_URL" ]] && GIT_REV="main"

            git clone "${GIT_URL}" "${SOURCE_DIR}"
            cd "${SOURCE_DIR}"
            if [[ -n "$GIT_REV" ]]; then
                git checkout "${GIT_REV}"
            fi
        fi

        cd "${SOURCE_DIR}"

        # Flatten directory if archive extracted into a single root folder
        if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls)" ]; then
            echo "Flattening nested directory..."
            mv "$(ls)"/* .
        fi

        echo "Generating SBOM via Maven..."

        # 1. Inject the JVM boundaries and crash behavior into Maven
        export MAVEN_OPTS="-XX:MaxRAMPercentage=80.0 -XX:+ExitOnOutOfMemoryError"

        # 2. Define the execution function
        # shellcheck disable=SC2086
        generate_bom() {
            mvn org.cyclonedx:cyclonedx-maven-plugin:"$(params.plugin-version)":makeAggregateBom \
                -s "$(workspaces.maven-settings.path)/settings.xml" \
                -Dcyclonedx.outputFormat=json \
                -Dcyclonedx.outputName=bom \
                -Dcyclonedx.outputDirectory="$(workspaces.data.path)" \
                $(params.additional-args)
        }

        # 3. Temporarily disable bash strict exit so we can catch the error
        set +e

        generate_bom
        EXIT_CODE=$?

        set -e # Re-enable strict mode

        # 4. Analyze the failure
        if [ $EXIT_CODE -ne 0 ]; then
            # Pause for 1 second to guarantee the JVM crash logs have flushed to disk
            sleep 1

            if grep -q "OutOfMemoryError" "$(workspaces.data.path)/logs/generate.log"; then
                echo "Java Heap OOM detected! Forcing a Kubernetes OOMKill to trigger SbomService retry..."

                # This awk command rapidly fills memory until Kubernetes kills the container
                # resulting in an actual "OOMKilled" to trigger the retry mechanism
                awk 'BEGIN{for(i=0;;i++)a[i]=i}'
            fi

            # If it failed for another reason, exit normally so Tekton marks it as Failed
            exit $EXIT_CODE
        fi

        otel_metric "sbomer.taskrun.sbom.bytes" "$(stat -c%s "$(workspaces.data.path)/bom.json")"
        otel_metric "sbomer.taskrun.sbom.components" "$(jq '.components | length' "$(workspaces.data.path)/bom.json")"

      volumeMounts:
        - mountPath: /shared
          name: shared
        - mountPath: /opt/otel
          name: otel-helpers

    - name: upload
      image: "{{ .Values.task.agent.image }}:{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.task.agent.pullPolicy }}
      env:
        - name: TRACEPARENT
          value: "$(params.trace-parent)"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "{{ .Values.task.otel.endpoint }}"
        - name: OTEL_SERVICE_NAME
          value: "sbomer-maven-generator-taskrun"
        - name: OTEL_SERVICE_VERSION
          value: "{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      script: |
        #!/usr/bin/env bash
        set -e
        source /opt/otel/otel-helpers.sh

        otel_start_span "upload" generation.id="$(params.generation-id)" storage.url="$(params.storage-service-url)"
        trap 'otel_end_span $?' EXIT

        mkdir -p $(workspaces.data.path)/logs
        otel_tee "$(workspaces.data.path)/logs/upload.log"

        echo "Preparing files for upload..."
        cd $(workspaces.data.path)
        touch curl_args.txt

        # Handle Main SBOMs
        find . -name "bom.json" | while read f; do
           CLEAN_PATH=$(echo "$f" | sed 's|^\./||')
           DIR=$(dirname "$CLEAN_PATH")

           # If the file is at the root directory, don't append a weird variant name
           if [ "$DIR" == "." ]; then
               NEW_NAME="bom-java.json"
           else
               VARIANT=$(echo "$DIR" | tr '/' '-')
               NEW_NAME="bom-${VARIANT}.json"
           fi

           cp "$f" "$NEW_NAME"
           echo "Staging $NEW_NAME..."
           echo "-F files=@$NEW_NAME" >> curl_args.txt
        done

        if [ -f "logs/generate.log" ]; then
           echo "Staging logs/generate.log..."
           echo "-F files=@logs/generate.log" >> curl_args.txt
        fi

        CURL_ARGS=$(cat curl_args.txt | tr '\n' ' ')
        echo "Uploading to $(params.storage-service-url)..."

        upload_files() {
          RESPONSE=$(curl -s -f -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "traceparent: $TRACEPARENT" \
            $CURL_ARGS \
            "$(params.storage-service-url)/api/v1/storage/generations/$(params.generation-id)")
        }
        otel_trace "curl-upload" upload_files

        otel_metric "sbomer.taskrun.upload.files" "$(echo "$RESPONSE" | jq 'length')"
        otel_metric "sbomer.taskrun.upload.bytes" "$(sed 's/-F files=@//' curl_args.txt | xargs stat -c%s | awk '{s+=$1} END{print s}')"

        CLEAN_RESPONSE=$(echo "$RESPONSE" | jq 'with_entries(select(.key | contains(".log") | not))')
        echo "Filtered Response (Task Result):"
        echo "$CLEAN_RESPONSE"
        echo -n "$CLEAN_RESPONSE" > $(results.sbom-url.path)
      volumeMounts:
        - mountPath: /opt/otel
          name: otel-helpers

  volumes:
    - name: shared
      emptyDir: {}
    - name: otel-helpers
      configMap:
        name: {{ .Release.Name }}-otel-helpers
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: {{ .Values.task.name.domino }}
  labels:
    {{- include "java-generator-chart.labels" . | nindent 4 }}
spec:
  description: Generates a CycloneDX SBOM using Quarkus Domino.
  results:
    - name: sbom-url
      description: "The JSON map of uploaded filenames to their permanent URLs"
  workspaces:
    - name: data
    - name: maven-settings
  params:
    - name: generation-id
      type: string
    - name: storage-service-url
      type: string
    - name: source-url
      type: string
    - name: java-version
      type: string
      default: "17.0.12-tem"
    - name: domino-additional-args
      type: string
      default: ""
    - name: retry-count
      type: string
      default: "5"
    - name: retry-delay
      type: string
      default: "1"
    - name: retry-max-delay
      type: string
      default: "60"
    - name: trace-parent
      type: string
      default: ""
  steps:
    - name: generate
      image: "{{ .Values.task.agent.image }}:{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.task.agent.pullPolicy }}
      resources:
        requests:
          cpu: 500m
          memory: 1000Mi
        limits:
          cpu: 800m
          memory: 2000Mi
      env:
        - name: TRACEPARENT
          value: "$(params.trace-parent)"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "{{ .Values.task.otel.endpoint }}"
        - name: OTEL_SERVICE_NAME
          value: "sbomer-domino-generator-taskrun"
        - name: OTEL_SERVICE_VERSION
          value: "{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      script: |
        #!/usr/bin/env bash
        set -Eeuo pipefail
        source /opt/otel/otel-helpers.sh

        otel_start_span "generate" source.url="$(params.source-url)" generation.id="$(params.generation-id)"
        trap 'otel_end_span $?' EXIT

        mkdir -p $(workspaces.data.path)/logs
        otel_tee "$(workspaces.data.path)/logs/generate.log"

        echo "Initializing SDKMAN!..."
        source /workdir/.sdkman/bin/sdkman-init.sh
        if [[ "$(params.java-version)" != "17.0.12-tem" ]]; then
            echo "Installing requested Java $(params.java-version)..."
            sdk install java "$(params.java-version)" || true
            sdk use java "$(params.java-version)"
        fi

        SOURCE_URL="$(params.source-url)"
        SOURCE_DIR="$(workspaces.data.path)/source-code"
        mkdir -p "${SOURCE_DIR}"

        echo "Resolving source from: $SOURCE_URL"
        if [[ "$SOURCE_URL" == *.zip* ]]; then
            curl -sL "${SOURCE_URL%%#*}" -o /tmp/source.zip
            unzip -q /tmp/source.zip -d "${SOURCE_DIR}"
        elif [[ "$SOURCE_URL" == *.tar.gz* ]] || [[ "$SOURCE_URL" == *.tgz* ]]; then
            curl -sL "${SOURCE_URL%%#*}" | tar -xz -C "${SOURCE_DIR}"
        else
            GIT_URL="${SOURCE_URL%#*}"
            GIT_REV="${SOURCE_URL#*#}"
            [[ "$GIT_REV" == "$GIT_URL" ]] && GIT_REV="main"

            git clone "${GIT_URL}" "${SOURCE_DIR}"
            cd "${SOURCE_DIR}"
            if [[ -n "$GIT_REV" ]]; then
                git checkout "${GIT_REV}"
            fi
        fi

        cd "${SOURCE_DIR}"
        if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls)" ]; then
            echo "Flattening nested directory..."
            mv "$(ls)"/* .
        fi

        echo "Generating SBOM via Domino..."
        # shellcheck disable=SC2086
        generate_bom() {
            java -jar /workdir/domino/domino.jar report \
                --project-dir="${SOURCE_DIR}" \
                --output-file="$(workspaces.data.path)/bom.json" \
                --manifest \
                -s "$(workspaces.maven-settings.path)/settings.xml" \
                $(params.domino-additional-args)
        }
        retry "domino-generate" generate_bom

        otel_metric "sbomer.taskrun.sbom.bytes" "$(stat -c%s "$(workspaces.data.path)/bom.json")"
        otel_metric "sbomer.taskrun.sbom.components" "$(jq '.components | length' "$(workspaces.data.path)/bom.json")"

      volumeMounts:
        - mountPath: /shared
          name: shared
        - mountPath: /opt/otel
          name: otel-helpers

    - name: upload
      image: "{{ .Values.task.agent.image }}:{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.task.agent.pullPolicy }}
      env:
        - name: TRACEPARENT
          value: "$(params.trace-parent)"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "{{ .Values.task.otel.endpoint }}"
        - name: OTEL_SERVICE_NAME
          value: "sbomer-domino-generator-taskrun"
        - name: OTEL_SERVICE_VERSION
          value: "{{ .Values.task.agent.tag | default .Chart.AppVersion }}"
      script: |
        #!/usr/bin/env bash
        set -e
        source /opt/otel/otel-helpers.sh

        otel_start_span "upload" generation.id="$(params.generation-id)" storage.url="$(params.storage-service-url)"
        trap 'otel_end_span $?' EXIT

        mkdir -p $(workspaces.data.path)/logs
        otel_tee "$(workspaces.data.path)/logs/upload.log"

        echo "Preparing files for upload..."
        cd $(workspaces.data.path)
        touch curl_args.txt

        find . -name "bom.json" | while read f; do
           CLEAN_PATH=$(echo "$f" | sed 's|^\./||')
           DIR=$(dirname "$CLEAN_PATH")

           if [ "$DIR" == "." ]; then
               NEW_NAME="bom-java.json"
           else
               VARIANT=$(echo "$DIR" | tr '/' '-')
               NEW_NAME="bom-${VARIANT}.json"
           fi

           cp "$f" "$NEW_NAME"
           echo "Staging $NEW_NAME..."
           echo "-F files=@$NEW_NAME" >> curl_args.txt
        done

        if [ -f "logs/generate.log" ]; then
           echo "Staging logs/generate.log..."
           echo "-F files=@logs/generate.log" >> curl_args.txt
        fi

        CURL_ARGS=$(cat curl_args.txt | tr '\n' ' ')
        echo "Uploading to $(params.storage-service-url)..."

        upload_files() {
          RESPONSE=$(curl -s -f -X POST \
            -H "Content-Type: multipart/form-data" \
            -H "traceparent: $TRACEPARENT" \
            $CURL_ARGS \
            "$(params.storage-service-url)/api/v1/storage/generations/$(params.generation-id)")
        }
        otel_trace "curl-upload" upload_files

        otel_metric "sbomer.taskrun.upload.files" "$(echo "$RESPONSE" | jq 'length')"
        otel_metric "sbomer.taskrun.upload.bytes" "$(sed 's/-F files=@//' curl_args.txt | xargs stat -c%s | awk '{s+=$1} END{print s}')"

        CLEAN_RESPONSE=$(echo "$RESPONSE" | jq 'with_entries(select(.key | contains(".log") | not))')
        echo "Filtered Response (Task Result):"
        echo "$CLEAN_RESPONSE"
        echo -n "$CLEAN_RESPONSE" > $(results.sbom-url.path)
      volumeMounts:
        - mountPath: /opt/otel
          name: otel-helpers

  volumes:
    - name: shared
      emptyDir: {}
    - name: otel-helpers
      configMap:
        name: {{ .Release.Name }}-otel-helpers